<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crash AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#020302;color:#fff;
 font-family:Arial,sans-serif;padding:20px;
}
.app{
 max-width:430px;margin:auto;border:1px solid #164d25;
 padding:18px;border-radius:20px;min-height:90vh;
}
h1{text-align:center;color:#ff1974}
.hero{
 border:1px solid #ff1974;border-radius:18px;
 padding:25px 10px;text-align:center;margin:20px 0;
}
.hero .plane{font-size:65px;color:#ff1974}
button{
 width:100%;padding:16px;margin:9px 0;
 background:#050505;border:1px solid #ff1974;
 color:#ff1974;border-radius:15px;font-size:18px;
}
.panel{
 border:1px solid #08752d;padding:18px;
 border-radius:16px;margin-top:20px;
}
h2{text-align:center;color:#ff1974}
.results{
 display:flex;gap:8px;justify-content:space-between;
}
.result{
 background:#071b0b;border:1px solid #08752d;
 padding:15px 5px;text-align:center;flex:1;color:#00d65a;
}
#status{text-align:center;color:#00d65a;padding:15px}
</style>
</head>
<body>
<div class="app">
<h1>CRASH AI</h1>
<div class="hero">
<div class="plane">✈</div>
<h2>لوحة التحليل الذكي</h2>
<p>تحليل إحصائي لنتائج الجولات السابقة</p>
</div>
<button onclick="startAnalysis()">ابدأ التحليل</button>
<button onclick="restore()">استعادة البيانات</button>
<div class="panel">
<h2>نتائج التحليل</h2>
<div class="results" id="results">
<div class="result">--</div>
<div class="result">--</div>
<div class="result">--</div>
</div>
<p id="status">بانتظار بدء التحليل</p>
</div>
</div>
<script>
function startAnalysis(){
 document.getElementById('status').textContent=
 'أدخل نتائج الجولات السابقة لتحليلها إحصائياً.';
}
function restore(){
 document.getElementById('status').textContent=
 'لا توجد بيانات محفوظة حالياً.';
}
</script>
</body>
</html>
