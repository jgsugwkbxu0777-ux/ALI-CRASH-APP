<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Statistics</title>
<style>
*{box-sizing:border-box}
body{
 background:#050505;
 color:white;
 font-family:Arial;
 padding:20px;
}
.app{max-width:430px;margin:auto}
h1{text-align:center;color:#ff1974}
.panel{
 background:#100a10;
 border:1px solid #ff1974;
 border-radius:18px;
 padding:20px;
 margin:18px 0;
}
button{
 width:100%;
 padding:16px;
 border:1px solid #ff1974;
 background:#160914;
 color:#ff1974;
 border-radius:12px;
 font-size:17px;
}
input{
 width:100%;
 padding:14px;
 margin:12px 0;
 background:#111;
 color:white;
 border:1px solid #555;
 border-radius:10px;
}
.result{
 color:#00e676;
 font-size:24px;
 text-align:center;
}
</style>
</head>
<body>
<div class="app">
<h1>AI STATISTICS</h1>
<div class="panel">
<h2>مختبر الاحتمالات</h2>
<p>تعلّم تحليل البيانات والاحتمالات من خلال تجربة تعليمية.</p>
<input id="number" type="number" placeholder="أدخل قيمة رقمية">
<button onclick="analyze()">تحليل البيانات</button>
</div>
<div class="panel">
<h2>نتيجة التحليل الإحصائي</h2>
<div id="result" class="result">بانتظار البيانات</div>
</div>
</div>
<script>
function analyze(){
 const n=Number(document.getElementById('number').value);
 const out=document.getElementById('result');
 if(!Number.isFinite(n)||n<=0){
 out.textContent='أدخل رقماً صحيحاً أكبر من صفر';
 return;
 }
 out.textContent='القيمة المدخلة: '+n+
 ' | مربعها: '+(n*n);
}
</script>
</body>
</html>
